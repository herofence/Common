name: immortalwrt_x86_64

on:
  workflow_dispatch:
  schedule:
  # 每周五 3:00执行一次
   - cron: 0 19 * * THU

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: configs/openwrt.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  THEME_SETTING_SH: scripts/theme-setting.sh
  PRESET_CLASH_SH: scripts/preset-clash-core.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  OPENWRT_NAME: scripts
  OPENWRT_NAME1: configs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 容量设置
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        
    - name: 查看项目代码
      uses: actions/checkout@main
      with:
          fetch-depth: 0
          
    - name: 清理缓存
      run: |
        echo "Cleaning previous build artifacts and caches..."
        sudo rm -rf $GITHUB_WORKSPACE/openwrt || true
        sudo rm -rf $RUNNER_TEMP/* || true
        sudo rm -rf $RUNNER_TOOL_CACHE/* || true
        sudo apt-get -qq clean || true
        sudo rm -rf /var/lib/apt/lists/* || true
        rm -rf ~/.cache/* || true
        echo "Cache cleanup complete."
        
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ( sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean ) &
        sudo timedatectl set-timezone "$TZ"
        
    - name: 系统信息
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        $GITHUB_WORKSPACE/$OPENWRT_NAME/system-Information.sh
        
    - name: 下载源码
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        # 获取源码提交信息
        COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an" 2>/dev/null || echo "作者: 未知")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        COMMIT_DATE=$(git show -s --date=short --format="时间: %ci" 2>/dev/null || echo "时间: 未知")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s" 2>/dev/null || echo "内容: 未知")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        COMMIT_HASH=$(git show -s --date=short --format="hash: %H" 2>/dev/null || echo "hash: 未知")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

    - name: 更新和安装源
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 修复 Docker
      working-directory: ./openwrt
      run: |
        echo "开始修复 Docker..."
        echo "当前目录: $(pwd)"
        
        # 确认 feeds 目录存在
        if [ ! -d "feeds" ]; then
          echo "错误：feeds 目录不存在"
          exit 1
        fi
        
        # 删除有问题的 Docker 包
        echo "删除有问题的 Docker 包..."
        rm -rf feeds/packages/utils/dockerd
        rm -rf feeds/packages/utils/docker
        rm -rf feeds/packages/utils/docker-compose
        rm -rf feeds/packages/utils/containerd
        rm -rf feeds/packages/utils/runc
        rm -rf feeds/packages/utils/libnetwork
        rm -rf feeds/luci/applications/luci-app-dockerman
        rm -rf feeds/luci/applications/luci-app-docker
        rm -rf feeds/luci/libs/luci-lib-docker
        # 重新安装 feeds（从 packages feed 获取 Docker 包）
        echo "重新安装 feeds..."
        ./scripts/feeds install -a
        # 检查新安装的 dockerd 版本
        echo "检查 dockerd 版本..."
        if [ -f "feeds/packages/utils/dockerd/Makefile" ]; then
          grep "PKG_VERSION" feeds/packages/utils/dockerd/Makefile
          
          # 检查是否是问题版本 29.6.1
          if grep -q "PKG_VERSION:=29.6.1" feeds/packages/utils/dockerd/Makefile; then
            echo "检测到问题版本 29.6.1，尝试修复..."
            
            # 方法1：修改版本号到旧版本
            sed -i 's/PKG_VERSION:=29.6.1/PKG_VERSION:=27.0.3/' feeds/packages/utils/dockerd/Makefile
            sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' feeds/packages/utils/dockerd/Makefile
            
            echo "已修改版本号："
            grep "PKG_VERSION\|PKG_HASH" feeds/packages/utils/dockerd/Makefile
          fi
        fi
        
        # 检查 dockerd Makefile 是否有问题
        if [ -f "feeds/packages/utils/dockerd/Makefile" ]; then
          echo "检查 dockerd Makefile 中的问题..."
          
          # 查找有问题的复制命令
          if grep -q "Copying nested executables" feeds/packages/utils/dockerd/Makefile; then
            echo "找到问题代码，进行修补..."
            
            # 备份
            cp feeds/packages/utils/dockerd/Makefile feeds/packages/utils/dockerd/Makefile.bak
            
            # 注释掉有问题的 cp 命令
            sed -i '/cp.*bundles\/binary-daemon/s/^/#/' feeds/packages/utils/dockerd/Makefile
            
            # 添加安全的复制命令
            sed -i '/#cp.*bundles\/binary-daemon/a\	cp -r $$(DOCKER_BUILD_DIR)/bundles/binary-daemon/* $(1)/usr/bin/ 2>/dev/null || true' feeds/packages/utils/dockerd/Makefile
            
            echo "修补完成"
          fi
        fi
        
        # 克隆 lisaac 的 luci-app-dockerman（如果需要）
        if [ ! -d "feeds/luci/applications/luci-app-dockerman" ]; then
          echo "克隆 lisaac/luci-app-dockerman..."
          git clone --depth=1 https://github.com/lisaac/luci-app-dockerman.git /tmp/dockerman
          
          if [ -d "/tmp/dockerman/luci-app-dockerman" ]; then
            mkdir -p feeds/luci/applications
            cp -r /tmp/dockerman/luci-app-dockerman feeds/luci/applications/
            echo "已复制 luci-app-dockerman"
          fi
          
          if [ -d "/tmp/dockerman/luci-lib-docker" ]; then
            mkdir -p feeds/luci/libs
            cp -r /tmp/dockerman/luci-lib-docker feeds/luci/libs/
            echo "已复制 luci-lib-docker"
          fi
          
          rm -rf /tmp/dockerman
        fi
        
        # 最后验证
        echo "========================================="
        echo "验证 Docker 包安装情况："
        for pkg in dockerd docker containerd runc; do
          if [ -d "feeds/packages/utils/$pkg" ]; then
            echo "✓ $pkg 已安装"
            if [ -f "feeds/packages/utils/$pkg/Makefile" ]; then
              version=$(grep "PKG_VERSION" "feeds/packages/utils/$pkg/Makefile" | head -1)
              echo "  $version"
            fi
          else
            echo "✗ $pkg 未安装"
          fi
        done
        
        if [ -d "feeds/luci/applications/luci-app-dockerman" ]; then
          echo "✓ luci-app-dockerman 已安装"
        else
          echo "✗ luci-app-dockerman 未安装"
        fi
        echo "========================================="
        
        echo "Docker 修复完成！"
        
    - name: 加载默认配置
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        $GITHUB_WORKSPACE/$THEME_SETTING_SH
        $GITHUB_WORKSPACE/$PRESET_CLASH_SH
        

    - name: 加载自定义配置
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        chmod +x $OPENWRT_NAME/*.sh && cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载安装包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
             
    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "date2=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        # 获取内核版本
        KERNEL_VER=$(cat bin/targets/x86/64/*.manifest | grep ^kernel | head -1 | cut -d- -f2 | tr -d ' ' 2>/dev/null || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        # 获取平台信息
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}' 2>/dev/null || echo "x86")
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}' 2>/dev/null || echo "64")
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

    - name: 整理文件
      id: organize
      if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/x86/64
        
        # 复制 build.config 和 config.buildinfo 到固件目录
        [ -f "$OPENWRT_PATH/.config" ] && cp "$OPENWRT_PATH/.config" build.config
        
        # 生成 config.buildinfo 文件
        cat > config.buildinfo << EOF
        CONFIG_TARGET_BOARD=${{ env.DEVICE_TARGET }}
        CONFIG_TARGET_SUBTARGET=${{ env.DEVICE_SUBTARGET }}
        CONFIG_KERNEL_VERSION=${{ env.KERNEL_VER }}
        CONFIG_REPO_URL=${{ env.REPO_URL }}
        CONFIG_REPO_BRANCH=${{ env.REPO_BRANCH }}
        CONFIG_BUILD_DATE=${{ env.date1 }}
        CONFIG_BUILD_NUMBER=${{ github.run_number }}
        CONFIG_RANDOM_CODE=${{ steps.random.outputs.random_code }}
        EOF
        
        # 清理不需要的文件，但保留固件和配置文件
        echo "清理不需要的文件..."
        rm -rf packages
        rm -f *rootfs.tar.gz *rootfs.img.gz *combined.img.gz *.bin *.json sha256sums *.manifest
        
        # 列出最终保留的文件
        echo "最终保留的文件："
        ls -lah
        
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: 上传固件
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: immortalwrt_${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.OPENWRT_NAME1 }}
        path: ${{ env.FIRMWARE }}

    - name: 发布固件
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.date2 }}" >> $GITHUB_OUTPUT
        cat > release.txt << EOF
        ### 固件信息
        - 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        - 固件源码: ${{ env.REPO_URL }}
        - 源码分支: ${{ env.REPO_BRANCH }}
        - 内核版本: ${{ env.KERNEL_VER }}
        - 默认地址: 192.168.2.1
        - 默认密码: password
        ### 固件版本
        - 固件编译前最后一次[主源码](${{ env.REPO_URL }}) 更新记录
        - ${{ env.COMMIT_DATE }}
        - ${{ env.COMMIT_MESSAGE }}
        - ${{ env.COMMIT_HASH }}
        - ${{ env.COMMIT_AUTHOR }}
        EOF
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: 发布说明
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.date2 }}
        tag_name: ${{ steps.tag.outputs.release_tag }}_build${{ github.run_number }}
        body_path: release.txt
