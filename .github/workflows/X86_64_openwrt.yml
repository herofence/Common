name: immortalwrt_x86_64

on:
  workflow_dispatch:
  schedule:
  # 每周五 3:00执行一次
   - cron: 0 19 * * THU

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: configs/openwrt.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  THEME_SETTING_SH: scripts/theme-setting.sh
  PRESET_CLASH_SH: scripts/preset-clash-core.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  OPENWRT_NAME: scripts
  OPENWRT_NAME1: configs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 容量设置
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        
    - name: 查看项目代码
      uses: actions/checkout@main
      with:
          fetch-depth: 0
          
    - name: 清理缓存
      run: |
        echo "Cleaning previous build artifacts and caches..."
        sudo rm -rf $GITHUB_WORKSPACE/openwrt || true
        sudo rm -rf $RUNNER_TEMP/* || true
        sudo rm -rf $RUNNER_TOOL_CACHE/* || true
        sudo apt-get -qq clean || true
        sudo rm -rf /var/lib/apt/lists/* || true
        rm -rf ~/.cache/* || true
        echo "Cache cleanup complete."
        
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ( sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean ) &
        sudo timedatectl set-timezone "$TZ"
        
    - name: 系统信息
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        $GITHUB_WORKSPACE/$OPENWRT_NAME/system-Information.sh
        
    - name: 下载源码
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        # 获取源码提交信息
        COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an" 2>/dev/null || echo "作者: 未知")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        COMMIT_DATE=$(git show -s --date=short --format="时间: %ci" 2>/dev/null || echo "时间: 未知")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s" 2>/dev/null || echo "内容: 未知")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        COMMIT_HASH=$(git show -s --date=short --format="hash: %H" 2>/dev/null || echo "hash: 未知")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

    - name: 更新和安装源
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: 修复 Docker
      working-directory: ./openwrt
      run: |
        echo "开始修复 Docker..."
        echo "当前目录: $(pwd)"
        
        # 修复 dockerd
        DOCKERD_MAKEFILE="feeds/packages/utils/dockerd/Makefile"
        if [ -f "$DOCKERD_MAKEFILE" ]; then
          echo "修复 dockerd..."
          cp "$DOCKERD_MAKEFILE" "${DOCKERD_MAKEFILE}.bak"
          sed -i 's/PKG_VERSION:=29.6.1/PKG_VERSION:=27.0.3/' "$DOCKERD_MAKEFILE"
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' "$DOCKERD_MAKEFILE"
          echo "dockerd 已修改为 27.0.3"
        fi
        
        # 修复 docker (CLI)
        DOCKER_MAKEFILE="feeds/packages/utils/docker/Makefile"
        if [ -f "$DOCKER_MAKEFILE" ]; then
          echo "修复 docker CLI..."
          cp "$DOCKER_MAKEFILE" "${DOCKER_MAKEFILE}.bak"
          # 检查版本
          if grep -q "PKG_VERSION:=29.6.1" "$DOCKER_MAKEFILE"; then
            sed -i 's/PKG_VERSION:=29.6.1/PKG_VERSION:=27.0.3/' "$DOCKER_MAKEFILE"
            sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' "$DOCKER_MAKEFILE"
            echo "docker CLI 已修改为 27.0.3"
          else
            echo "docker CLI 版本:"
            grep "PKG_VERSION" "$DOCKER_MAKEFILE" | head -1
          fi
        fi
        
        # 修复 docker-compose
        COMPOSE_MAKEFILE="feeds/packages/utils/docker-compose/Makefile"
        if [ -f "$COMPOSE_MAKEFILE" ]; then
          echo "修复 docker-compose..."
          cp "$COMPOSE_MAKEFILE" "${COMPOSE_MAKEFILE}.bak"
          # 保持原版本，只跳过 hash 检查
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' "$COMPOSE_MAKEFILE"
          echo "docker-compose 已修复"
        fi
        
        # 修复 containerd
        CONTAINERD_MAKEFILE="feeds/packages/utils/containerd/Makefile"
        if [ -f "$CONTAINERD_MAKEFILE" ]; then
          echo "修复 containerd..."
          cp "$CONTAINERD_MAKEFILE" "${CONTAINERD_MAKEFILE}.bak"
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' "$CONTAINERD_MAKEFILE"
          echo "containerd 已修复"
        fi
        
        # 修复 runc
        RUNC_MAKEFILE="feeds/packages/utils/runc/Makefile"
        if [ -f "$RUNC_MAKEFILE" ]; then
          echo "修复 runc..."
          cp "$RUNC_MAKEFILE" "${RUNC_MAKEFILE}.bak"
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' "$RUNC_MAKEFILE"
          echo "runc 已修复"
        fi
        
        # 修复 tini（如果存在）
        TINI_MAKEFILE="feeds/packages/utils/tini/Makefile"
        if [ -f "$TINI_MAKEFILE" ]; then
          echo "修复 tini..."
          cp "$TINI_MAKEFILE" "${TINI_MAKEFILE}.bak"
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' "$TINI_MAKEFILE"
          echo "tini 已修复"
        fi
        
        # 检查 dockerd Makefile 中的安装命令
        echo "检查 dockerd 安装命令..."
        if [ -f "$DOCKERD_MAKEFILE" ]; then
          echo "安装部分内容："
          sed -n '/define Package\/dockerd\/install/,/endef/p' "$DOCKERD_MAKEFILE"
          
          # 检查是否有问题的安装命令
          if grep -q "INSTALL_BIN.*bundles/binary-daemon" "$DOCKERD_MAKEFILE"; then
            echo "找到 bundles/binary-daemon 安装命令"
            # 添加错误处理，防止文件不存在时失败
            sed -i 's/\$(INSTALL_BIN) \$(PKG_BUILD_DIR)\/bundles\/binary-daemon\/docker-proxy/\$(INSTALL_BIN) \$(PKG_BUILD_DIR)\/bundles\/binary-daemon\/docker-proxy 2>\/dev\/null || true/' "$DOCKERD_MAKEFILE"
            echo "已添加错误处理"
          fi
        fi
        
        # 验证所有修改
        echo "========================================="
        echo "验证所有 Docker 相关包版本："
        for pkg in dockerd docker docker-compose containerd runc tini; do
          makefile="feeds/packages/utils/$pkg/Makefile"
          if [ -f "$makefile" ]; then
            version=$(grep "PKG_VERSION" "$makefile" | head -1)
            echo "✓ $pkg: $version"
          else
            echo "✗ $pkg: 未找到"
          fi
        done
        echo "========================================="
        
        echo "Docker 修复完成！"
        
    - name: 加载默认配置
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        $GITHUB_WORKSPACE/$THEME_SETTING_SH
        $GITHUB_WORKSPACE/$PRESET_CLASH_SH
        

    - name: 加载自定义配置
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        chmod +x $OPENWRT_NAME/*.sh && cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载安装包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
             
    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "date2=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        # 获取内核版本
        KERNEL_VER=$(cat bin/targets/x86/64/*.manifest | grep ^kernel | head -1 | cut -d- -f2 | tr -d ' ' 2>/dev/null || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        # 获取平台信息
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}' 2>/dev/null || echo "x86")
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}' 2>/dev/null || echo "64")
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

    - name: 整理文件
      id: organize
      if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/x86/64
        
        # 复制 build.config 和 config.buildinfo 到固件目录
        [ -f "$OPENWRT_PATH/.config" ] && cp "$OPENWRT_PATH/.config" build.config
        
        # 生成 config.buildinfo 文件
        cat > config.buildinfo << EOF
        CONFIG_TARGET_BOARD=${{ env.DEVICE_TARGET }}
        CONFIG_TARGET_SUBTARGET=${{ env.DEVICE_SUBTARGET }}
        CONFIG_KERNEL_VERSION=${{ env.KERNEL_VER }}
        CONFIG_REPO_URL=${{ env.REPO_URL }}
        CONFIG_REPO_BRANCH=${{ env.REPO_BRANCH }}
        CONFIG_BUILD_DATE=${{ env.date1 }}
        CONFIG_BUILD_NUMBER=${{ github.run_number }}
        CONFIG_RANDOM_CODE=${{ steps.random.outputs.random_code }}
        EOF
        
        # 清理不需要的文件，但保留固件和配置文件
        echo "清理不需要的文件..."
        rm -rf packages
        rm -f *rootfs.tar.gz *rootfs.img.gz *combined.img.gz *.bin *.json sha256sums *.manifest
        
        # 列出最终保留的文件
        echo "最终保留的文件："
        ls -lah
        
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: 上传固件
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: immortalwrt_${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.OPENWRT_NAME1 }}
        path: ${{ env.FIRMWARE }}

    - name: 发布固件
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.date2 }}" >> $GITHUB_OUTPUT
        cat > release.txt << EOF
        ### 固件信息
        - 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        - 固件源码: ${{ env.REPO_URL }}
        - 源码分支: ${{ env.REPO_BRANCH }}
        - 内核版本: ${{ env.KERNEL_VER }}
        - 默认地址: 192.168.2.1
        - 默认密码: password
        ### 固件版本
        - 固件编译前最后一次[主源码](${{ env.REPO_URL }}) 更新记录
        - ${{ env.COMMIT_DATE }}
        - ${{ env.COMMIT_MESSAGE }}
        - ${{ env.COMMIT_HASH }}
        - ${{ env.COMMIT_AUTHOR }}
        EOF
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: 发布说明
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.date2 }}
        tag_name: ${{ steps.tag.outputs.release_tag }}_build${{ github.run_number }}
        body_path: release.txt
